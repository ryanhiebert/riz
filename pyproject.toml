[project]
name = "riz"
version = "0.1"
description = "A statically typed, interpreted, and embeddable programming language with Python interoperability"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanhiebert/riz"
Repository = "https://github.com/ryanhiebert/riz"
Issues = "https://github.com/ryanhiebert/riz/issues"
Changelog = "https://github.com/ryanhiebert/riz/blob/main/CHANGELOG.md"

[project.scripts]
riz = "riz.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # package lives at ./riz, not ./src/riz

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
python_files = ["*.py"]
